default: &default
  url: <%= ENV['DATABASE_URL'].try(:sub, /^postgres(ql)?:\/\//, 'postgis://') %>
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  <<: *default
  database: geo_stack_development

test:
  <<: *default
  database: geo_stack_test
  # PostGIS extension requires superuser; use postgres for schema load (db:test:prepare).
  username: <%= ENV.fetch("TEST_DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("TEST_DATABASE_PASSWORD", "") %>

production:
  <<: *default
  database: geo_stack_production
  username: geo_stack
  password: <%= ENV["GEO_STACK_DATABASE_PASSWORD"] %>
