require: rubocop-rails

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - Gemfile
    - bin/*
    - config/initializers/**/*
    - config/environments/**/*
    - config/puma.rb
    - db/migrate/*.rb
    - db/schema.rb
    - node_modules/**/*
    - storage/**/*
    - tmp/**/*
    - vendor/bundle/**/*

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space

Lint/MissingSuper:
  Enabled: true
  Exclude:
    - 'app/components/**/*'

Lint/UselessConstantScoping:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 10
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'

Metrics/BlockLength:
  Enabled: false

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'

Rails/Output:
  Enabled: false

Rails/BulkChangeTable:
  Enabled: false

Rails/ReversibleMigration:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: true
  Exclude:
    - 'db/migrate/**/*'

Rails/I18nLocaleAssignment:
  Enabled: true
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'

Style/SafeNavigationChainLength:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiterals:
  Enabled: false
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Exclude:
    - db/migrate/**/*

Style/ArrayCoercion:
  Enabled: true

Style/HashAsLastArrayItem:
  Enabled: true

Style/HashLikeCase:
  Enabled: true

Style/RedundantAssignment:
  Enabled: true

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: true
  EnforcedStyle: compact

Style/CommentAnnotation:
  Enabled: false

Style/OpenStructUse:
  Enabled: false
